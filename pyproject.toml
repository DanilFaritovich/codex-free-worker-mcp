[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codex-free-worker"
version = "0.1.0"
description = "Local MCP bridge delegating bounded Codex repository tasks to configurable execution backends."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=2.0,<3.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.11,<1.0",
  "mypy>=1.15,<2.0",
]

[project.scripts]
codex-free-worker = "codex_free_worker.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_free_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
